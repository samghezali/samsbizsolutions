    <!-- Structured Data - FAQPage for Financement OPCO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Qui peut b\u00e9n\u00e9ficier du financement OPCO ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Toutes les entreprises cotisent \u00e0 un OPCO via la contribution \u00e0 la formation professionnelle. Les TPE et PME de moins de 50 salari\u00e9s b\u00e9n\u00e9ficient d'un accompagnement renforc\u00e9 et de prises en charge plus avantageuses. Les ind\u00e9pendants et micro-entrepreneurs peuvent \u00e9galement solliciter leur OPCO ou leur FAF."
          }
        },
        {
          "@type": "Question",
          "name": "Quel est le montant de la prise en charge OPCO ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le montant varie selon votre OPCO, votre branche professionnelle et la taille de votre entreprise. Certains OPCO financent jusqu'\u00e0 100% des co\u00fbts p\u00e9dagogiques pour les TPE. Sam's Biz Solutions propose un diagnostic offert pour v\u00e9rifier votre \u00e9ligibilit\u00e9."
          }
        },
        {
          "@type": "Question",
          "name": "Combien de temps faut-il pour obtenir l'accord de l'OPCO ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "En g\u00e9n\u00e9ral, comptez 2 \u00e0 4 semaines entre le d\u00e9p\u00f4t de votre demande et la r\u00e9ponse de l'OPCO. Nous recommandons de d\u00e9poser votre dossier au moins 3 semaines avant le d\u00e9but de la formation."
          }
        },
        {
          "@type": "Question",
          "name": "Pourquoi la certification Qualiopi est-elle indispensable ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Depuis le 1er janvier 2022, seuls les organismes certifi\u00e9s Qualiopi peuvent b\u00e9n\u00e9ficier de fonds publics ou mutualis\u00e9s, y compris les financements OPCO. Sam's Biz Solutions dispose du processus certifi\u00e9 Qualiopi."
          }
        },
        {
          "@type": "Question",
          "name": "Les formations en distanciel sont-elles finançables par l'OPCO ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, toutes nos formations sont disponibles en pr\u00e9sentiel \u00e0 Pontoise et en distanciel via visioconf\u00e9rence. Les deux modalit\u00e9s sont \u00e9ligibles au financement OPCO dans les m\u00eames conditions."
          }
        },
        {
          "@type": "Question",
          "name": "Les ind\u00e9pendants et micro-entrepreneurs peuvent-ils \u00eatre financ\u00e9s ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui. Les travailleurs ind\u00e9pendants cotisent \u00e0 un FAF (Fonds d'Assurance Formation) : AGEFICE pour les commer\u00e7ants, FIFPL pour les professions lib\u00e9rales, FAFCEA pour les artisans."
          }
        }
      ]
    }
