# Configuration Netlify pour Sam's Biz Solutions
# Domaine officiel: https://samsbizsolutions.fr

[build]
  command = "pnpm run build"
  publish = "dist/public"

# Redirection 301 de l'ancien domaine
[[redirects]]
  from = "https://samsbizsolutions.business/*"
  to = "https://samsbizsolutions.fr/:splat"
  status = 301
  force = true

# Redirection SPA - toutes les routes non-trouvées vont à index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de sécurité et de cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache pour les assets statiques
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache pour les images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Cache pour les documents
[[headers]]
  for = "/documents/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Pas de cache pour HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sitemap et robots.txt
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
